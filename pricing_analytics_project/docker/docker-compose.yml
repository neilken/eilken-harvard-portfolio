services:
  postgres:
    image: postgres:16
    container_name: pricing_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pricing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pw
    ports:
      - "5432:5432"
    volumes:
      - pricing_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d

volumes:
  pricing_pgdata:
