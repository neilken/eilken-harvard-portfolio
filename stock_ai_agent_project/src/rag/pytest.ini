[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra
    --disable-warnings
markers =
    unit: Unit tests (run quickly, no external dependencies)
    integration: Integration tests (require mocked services)
    system: System tests (require running server)
    slow: Tests that take significant time to run

# Coverage options (only used when pytest-cov is installed)
# Run with: pytest --cov=rag --cov-report=term --cov-report=html

