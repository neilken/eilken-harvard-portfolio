[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.3.0",
    "fastapi>=0.115.12",
    "fastmcp>=2.13.0.2",
    "google-genai>=1.47.0",
    "pillow>=12.0.0",
    "uvicorn>=0.34.3",
    "typing",
    "google",
    "langchain",
    "langgraph",
    "langchain_google_vertexai",
    "langchain_core",
    "langchain_community",
    "pandas",
    "numpy"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "httpx>=0.24.0",  # For FastAPI TestClient
    "coverage>=7.0.0",
    "iniconfig>=2.0.0",
    "pluggy>=1.0.0",
]

[tool.black]
line-length = 127
target-version = ['py312']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 127
extend-ignore = ["E203", "W503", "E501", "E722", "W504", "E402", "F401", "F841", "F811", "F821"]
exclude = [
    ".eggs",
    ".eggs/*",
    "*.egg",
    "*.egg-info",
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
]