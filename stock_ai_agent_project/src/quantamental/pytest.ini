# Pytest Configuration for Quantamental Pipeline
# MS4 Testing Setup

[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Async test configuration
asyncio_mode = auto

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-config=coverage.ini
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    # Note: --cov-fail-under=50 is set explicitly in CI workflow for unit tests only
    # Integration and system tests don't require coverage threshold
    --ignore=wandb
    --ignore=artifacts
    --ignore=data
    --ignore=__pycache__


# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests across modules
    system: System tests (end-to-end pipeline tests)
    slow: Tests that take longer to run (e.g., API calls)
    api: Tests requiring external API calls
    gcs: Tests requiring GCS access
    wandb: Tests requiring W&B access

# Ignore specific warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning:wandb
    ignore::FutureWarning:google

# Timeout for slow tests (optional)
# timeout = 300