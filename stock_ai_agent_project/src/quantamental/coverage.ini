[coverage:run]
branch = True
omit =
    tests/*
    */tests/*
    **/tests/*
    */__init__.py
    */verify_setup.py
    */generate_stock_reasoning.py
    */rag_helpers.py
    */model_validation.py
    */main.py
    */test_path.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.: