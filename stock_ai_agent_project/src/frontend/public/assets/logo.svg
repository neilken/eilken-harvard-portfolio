<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="#ffffff" stroke="#16c79a" stroke-width="8"/>
  
  <!-- Stock Chart Rising Arrow -->
  <g transform="translate(200, 200)">
    <!-- Chart bars in background -->
    <rect x="-90" y="20" width="25" height="60" fill="#16c79a" opacity="0.3"/>
    <rect x="-55" y="-10" width="25" height="90" fill="#16c79a" opacity="0.4"/>
    <rect x="-20" y="-30" width="25" height="110" fill="#16c79a" opacity="0.5"/>
    <rect x="15" y="-60" width="25" height="140" fill="#16c79a" opacity="0.6"/>
    
    <!-- Explosive burst effect -->
    <g opacity="0.8">
      <line x1="0" y1="-100" x2="0" y2="-130" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
      <line x1="60" y1="-80" x2="80" y2="-100" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
      <line x1="90" y1="-20" x2="115" y2="-20" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
      <line x1="60" y1="40" x2="80" y2="60" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
      <line x1="-60" y1="-80" x2="-80" y2="-100" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
      <line x1="-90" y1="-20" x2="-115" y2="-20" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
      <line x1="-60" y1="40" x2="-80" y2="60" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Main upward trending arrow -->
    <path d="M -80 50 L -40 10 L 0 -20 L 40 -50 L 70 -80" 
          fill="none" 
          stroke="#16c79a" 
          stroke-width="8" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Arrow head -->
    <path d="M 70 -80 L 50 -70 L 60 -60 Z" fill="#16c79a"/>
    <path d="M 70 -80 L 80 -60 L 60 -60 Z" fill="#16c79a"/>
    
    <!-- Target/Crosshair symbol -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ff6b6b" stroke-width="4"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="-35" y1="0" x2="-50" y2="0" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="35" y1="0" x2="50" y2="0" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="0" y1="-35" x2="0" y2="-50" stroke="#ff6b6b" stroke-width="3"/>
    <line x1="0" y1="35" x2="0" y2="50" stroke="#ff6b6b" stroke-width="3"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#16c79a" text-anchor="middle">
    STOCK
  </text>
  <text x="200" y="375" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ff6b6b" text-anchor="middle">
    BUSTERS
  </text>
</svg>